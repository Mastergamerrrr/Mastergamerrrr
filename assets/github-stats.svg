      </g>
  <line x1="42" y1="153" x2="858" y2="153" stroke="#30363d" />
  <text class="section" x="42" y="177">LANGUAGE FOOTPRINT</text>
  <g clip-path="url(#bar-clip)"><rect x="42.0" y="191" width="445.6" height="9" fill="#f1e05a" /><rect x="487.6" y="191" width="186.1" height="9" fill="#b07219" /><rect x="673.7" y="191" width="54.7" height="9" fill="#478cbf" /><rect x="728.4" y="191" width="46.3" height="9" fill="#512bd4" /><rect x="774.7" y="191" width="43.4" height="9" fill="#563d7c" /></g>
  
      <g transform="translate(42 229)">
        <circle cx="5" cy="-4" r="5" fill="#f1e05a" />
